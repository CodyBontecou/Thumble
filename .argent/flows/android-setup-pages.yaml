  - await: {"visible": {"text": "Your keypad is ready when you are."}, "timeout": 10000}
  - await: { idle: true }
  - tap:
      text: Open Thumble
  - tool: button
    args:
      button: home
  - tool: launch-app
    args:
      bundleId: com.thumble.android
  - await: {"visible": {"text": "Scan Mac QR Code"}, "timeout": 10000}
  - await: { idle: true }
  - tap:
      text: Setup guide
  - tool: button
    args:
      button: home
  - tool: launch-app
    args:
