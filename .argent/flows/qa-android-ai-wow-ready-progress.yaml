executionPrerequisite: The Pixel 7 QA app has its portrait controller menu open, paired to the sole receiver. Pixel WoW Journey revision 2 is adopted and acknowledged at activation 9; controls are paused and WoW checks are incomplete. Menu opening is external setup using the documented Argent landscape rotation workaround, excluded from this semantic regression.
steps:
