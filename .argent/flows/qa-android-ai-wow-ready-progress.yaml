  - await: { idle: true, stableFor: 800 }
  - tap: { text: AI to game }
  - await: { visible: { text: From your AI } }
  - await: { idle: true, stableFor: 800 }
  - assert: { text: { in: { text: AI TO GAME · }, contains: 3 OF 4 COMPLETE } }
  - scroll-to: { target: { text: 4 · Tested in your game } }
  - assert: { visible: { text: ✓ · Mac ready } }
  - assert: { visible: { text: 4 · Tested in your game } }
  - assert: { visible: { text: Test this controller in your game } }
  - tap: { text: Done }
  - await: { visible: { text: Controller paused } }
  - await: { idle: true, stableFor: 800 }
