steps:
  - echo: Base must show Heroic Strike. LT must clear the spell slots and show
      Target Scan Enemy; releasing restores Heroic Strike. Raw Down/Up preserves
      the held finger across checks.
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Heroic Strike
  - tool: gesture-custom
    args:
      events:
        - type: Down
          x: 0.6295
          y: 0.395
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Target Scan Enemy
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: Heroic Strike
  - tool: gesture-custom
    args:
      events:
        - type: Up
          x: 0.6295
          y: 0.395
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Heroic Strike
  - tool: gesture-custom
    args:
      events:
        - type: Down
          x: 0.6295
          y: 0.605
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Quick menu
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: Heroic Strike
  - echo: Release RT to base, then hold both triggers. Expect Utility ring and
      cleared spell slots in the app and WoW. Release both restores base.
  - tool: gesture-custom
    args:
      events:
        - type: Up
          x: 0.6295
          y: 0.605
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Heroic Strike
  - tool: gesture-custom
    args:
      events:
        - type: Down
          x: 0.6295
          y: 0.395
          x2: 0.6295
          y2: 0.605
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Utility ring
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: Heroic Strike
  - tool: gesture-custom
    args:
      events:
        - type: Up
          x: 0.6295
          y: 0.395
          x2: 0.6295
          y2: 0.605
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Heroic Strike
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: Utility ring
executionPrerequisite: com.thumble.consoleportartworkqa simulator app open in
  LandscapeRight, Fuskotargar ConsolePort layout received automatically from the
  real Local Test Receiver, unlimited access active and neutral input. WoW
  foreground in Valley of Trials outside combat. Coordinates use the simulator
  AX orientation. This fragment tests the actual exported character labels, not
  a fixture or generated controller.
