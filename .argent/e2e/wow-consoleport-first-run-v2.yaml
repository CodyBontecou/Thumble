steps:
  - echo: Fresh isolated QA app required. Reinstall com.thumble.wowsetupqa before replay.
  - launch: com.thumble.wowsetupqa
  - await: { visible: { text: WoW on your Mac. } }
  - await: { idle: true }
  - echo: Choose Set up your game. Expect the World of Warcraft version picker.
  - tap: { text: Set up your game }
  - await: { visible: { text: Which version of } }
  - await: { idle: true }
