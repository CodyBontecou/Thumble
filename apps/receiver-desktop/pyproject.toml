[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thumble-receiver"
version = "0.1.0"
description = "Windows and Linux LAN gamepad receiver for Thumble"
requires-python = ">=3.11"
dependencies = [
  "websockets==15.0.1",
  "cryptography==46.0.3",
  "qrcode==8.2",
  "evdev==1.9.2; sys_platform == 'linux'",
  "vgamepad @ https://github.com/yannbouteiller/vgamepad/archive/3f910aa8bbde49a576683db74ad5e4a0879f8a80.zip ; sys_platform == 'win32'",
]

[project.scripts]
thumble-receiver = "thumble_receiver.__main__:main"

[tool.setuptools.packages.find]
include = ["thumble_receiver*"]
