[package]
name = "thumble-tunnel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "thumble_tunnel"
path = "src/lib.rs"

[dependencies]
base64 = "=0.22.1"
futures = "=0.3.31"
rand = "=0.9.2"
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "server", "transport-async-rw"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.27.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "=3.22.0"
