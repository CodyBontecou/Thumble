[package]
name = "thumble-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "thumble-gateway"
path = "src/main.rs"

[lib]
name = "thumble_gateway"
path = "src/lib.rs"

[dependencies]
axum = { version = "=0.8.9", features = ["ws", "http1", "tokio"] }
futures = "=0.3.31"
hmac = "=0.12.1"
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "server", "transport-async-rw", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thumble-builder = { path = "../thumble-builder" }
thumble-core = { path = "../thumble-core" }
thumble-tunnel = { path = "../thumble-tunnel" }
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tower = "=0.5.2"
tower-http = { version = "=0.6.11", features = ["limit"] }
url = "=2.5.8"

[dev-dependencies]
base64 = "=0.22.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "form", "query"] }
sha2 = "=0.10.9"
tempfile = "=3.22.0"
thumble-host = { path = "../thumble-host" }
thumble-mcp = { path = "../thumble-mcp" }
tokio-tungstenite = { version = "=0.27.0", features = ["rustls-tls-webpki-roots"] }
