[package]
name = "thumble-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "thumble_mcp"
path = "src/lib.rs"

[[bin]]
name = "thumble-mcp"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.5.47", features = ["derive"] }
futures = "=0.3.31"
thumble-core = { path = "../thumble-core" }
thumble-host = { path = "../thumble-host" }
thumble-protocol = { path = "../thumble-protocol" }
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "macros", "transport-io", "client"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
tempfile = "=3.22.0"
tokio = { version = "=1.47.1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time", "process"] }
tokio-util = { version = "=0.7.16", features = ["codec"] }
[dev-dependencies]
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "server", "macros", "transport-io"] }
tempfile = "=3.22.0"
tokio = { version = "=1.47.1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
