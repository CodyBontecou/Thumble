[package]
name = "thumble-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "thumble_host"
path = "src/lib.rs"

[[bin]]
name = "thumble-host"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.47", features = ["derive"] }
fs2 = "=0.4.3"
futures-util = "=0.3.31"
libc = "=0.2.175"
plist = "=1.8.0"
thumble-core = { path = "../thumble-core" }
thumble-protocol = { path = "../thumble-protocol" }
rand = "=0.9.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
socket2 = { version = "=0.6.0", features = ["all"] }
tokio = { version = "=1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "=0.27.0"
uuid = { version = "=1.18.1", features = ["serde", "v4", "v5"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
core-foundation = "=0.10.1"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "block2"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "hid", "hidsystem", "block2", "dispatch2", "objc2"] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }

[dev-dependencies]
tempfile = "=3.22.0"
