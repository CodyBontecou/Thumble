name: Thumble
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 3
    VERSIONING_SYSTEM: apple-generic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  ThumbleMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac
      - path: Resources/Mac/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPadMac
        PRODUCT_NAME: Thumble Mac
        INFOPLIST_FILE: Resources/Mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    postBuildScripts:
      - name: Enforce Pairing Stack Budget
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            python3 "$SRCROOT/scripts/check-controller-stack-frames.py" \
              --scope mac-network \
              --object-root "${OBJECT_FILE_DIR_normal:-$OBJECT_FILE_DIR}"
          fi
  ThumbleCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac/KeyMap.swift
      - path: Sources/Mac/MacControlOutputBinding.swift
      - path: Sources/Mac/MacConfigurationBindings.swift
      - path: Sources/CLI
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPad
        PRODUCT_NAME: thumble
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbleBridge:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac/KeyMap.swift
      - path: Sources/Mac/MacControlOutputBinding.swift
      - path: Sources/Mac/MacConfigurationBindings.swift
      - path: Sources/Bridge
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.ThumbleBridge
        PRODUCT_NAME: thumble-bridge
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbleLegacyThumbConsoleCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac/KeyMap.swift
      - path: Sources/Mac/MacControlOutputBinding.swift
      - path: Sources/Mac/MacConfigurationBindings.swift
      - path: Sources/CLI
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.ThumbConsoleCLI
        PRODUCT_NAME: thumbconsole
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbleLegacyCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac/KeyMap.swift
      - path: Sources/Mac/MacControlOutputBinding.swift
      - path: Sources/Mac/MacConfigurationBindings.swift
      - path: Sources/CLI
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPadCLI
        PRODUCT_NAME: pocketpad
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbleCLITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac/KeyMap.swift
      - path: Sources/Mac/MacControlOutputBinding.swift
      - path: Sources/Mac/MacConfigurationBindings.swift
      - path: Sources/Mac/MacRustAuthorityInterlock.swift
      - path: Sources/Mac/MacSharedKeypadImport.swift
      - path: Sources/CLI/ThumbleCLIBackend.swift
      - path: Sources/iOS/IOSLocalKeypadUX.swift
      - path: Sources/iOS/IOSPendingBuilderArtifactStore.swift
      - path: Sources/iOS/IOSBuilderArtifactPickup.swift
      - path: Tests
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPadCLITests
        PRODUCT_NAME: ThumbleCLITests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -D XCODEBUILD_TEST"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbleiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources/iOS/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPad.iOS
        PRODUCT_NAME: Thumble
        INFOPLIST_FILE: Resources/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/iOS/ThumbleiOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Enforce Controller Stack Budget
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            python3 "$SRCROOT/scripts/check-controller-stack-frames.py" \
              --scope controller \
              --object-root "${OBJECT_FILE_DIR_normal:-$OBJECT_FILE_DIR}"
          fi
      - name: Enforce iOS Runtime Stack Budget
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            python3 "$SRCROOT/scripts/check-controller-stack-frames.py" \
              --scope ios-runtime \
              --object-root "${OBJECT_FILE_DIR_normal:-$OBJECT_FILE_DIR}"
          fi
schemes:
  ThumbleTests:
    build:
      targets:
        ThumbleCLITests: [test]
    test:
      targets:
        - ThumbleCLITests
  ThumbleMac:
    build:
      targets:
        ThumbleMac: all
    run:
      config: Debug
    archive:
      config: Release
  ThumbleiOS:
    build:
      targets:
        ThumbleiOS: all
    run:
      config: Debug
    archive:
      config: Release
  ThumbleCLI:
    build:
      targets:
        ThumbleCLI: all
        ThumbleLegacyThumbConsoleCLI: all
        ThumbleLegacyCLI: all
        ThumbleCLITests: [test]
    test:
      targets:
        - ThumbleCLITests
