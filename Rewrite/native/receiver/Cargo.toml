[package]
name = "thumble-rewrite-receiver"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[features]
default = []
output-bridge = ["dep:thumble-rewrite-output-core"]
output-macos = ["output-bridge", "thumble-rewrite-output-core/macos-hid"]
output-doctor-macos = ["dep:thumble-rewrite-output-core", "thumble-rewrite-output-core/macos-hid"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
aes-gcm = "=0.10.3"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "=0.17.14"
time = "=0.3.55"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
subtle = "=2.6.1"
fs2 = "=0.4.3"
libc = "=0.2.175"

thumble-rewrite-output-core = { path = "../output-core", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
