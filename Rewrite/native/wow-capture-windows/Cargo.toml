[package]
name = "thumble-rewrite-wow-capture-windows"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
[workspace]
[dependencies]
thumble-rewrite-windows-optical = { package = "thumble-windows-optical-core", path = "../windows-optical" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Security_Authorization_AppCapabilityAccess", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
