name: Mobile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Mobile source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run mobile:check

  ios-release:
    name: iOS Release launch
    needs: source
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ARGENT_SIMULATOR_NO_WINDOW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Prepare Xcode
        run: |
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
      # argent gives its tool server 15 s to start, which a freshly booted simulator
      # can exceed on a busy runner, so start one long-lived server while idle.
      - name: Install pinned simulator tooling and start its server
        run: |
          npm install --global @swmansion/argent@0.32.0
          argent server start --detach
          argent server status
      # Cold-booting a simulator on a fresh runner can take longer than the
      # five-minute HTTP limit of `argent run boot-device`, so boot it here and
      # hand the booted device to the smoke test.
      - name: Boot a dedicated iPhone simulator
        id: simulator
        timeout-minutes: 25
        run: node tools/mobile/ci-simulator.mjs >> "$GITHUB_OUTPUT"
      - name: Record available test devices
        run: |
          for attempt in 1 2 3; do
            argent run list-devices --args '{}' --json && exit 0
            echo "list-devices failed (attempt $attempt/3)"; sleep 20
          done
          exit 1
      - name: Build Release and prove two clean-install launches
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: npm run mobile:smoke:ios -- --output build/mobile-ci --device "$SIMULATOR_UDID"
      - name: Print the argent tool server log
        if: failure()
        run: argent server logs | tail -200 || true
      - name: Preserve launch reports and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-launch-${{ github.sha }}
          path: |
            build/mobile-ci/*.json
            build/mobile-ci/*.log
            build/mobile-ci/screenshots/**
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Mobile required checks
    if: always()
    needs: [source, ios-release]
    runs-on: ubuntu-latest
    steps:
      - name: Require both validation jobs
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          IOS_RESULT: ${{ needs.ios-release.result }}
        run: test "$SOURCE_RESULT" = success && test "$IOS_RESULT" = success
