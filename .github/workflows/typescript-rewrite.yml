name: TypeScript rewrite (headless)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        "Rewrite/**",
        "Host/fixtures/gamepad/v2.json",
        ".github/workflows/typescript-rewrite.yml",
      ]
  pull_request:
    paths:
      [
        "Rewrite/**",
        "Host/fixtures/gamepad/v2.json",
        ".github/workflows/typescript-rewrite.yml",
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Rewrite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rewrite/native/receiver
      - run: bun install --frozen-lockfile
      - name: Verify independent Node AES-GCM packet oracle
        run: node tooling/verify-input-packet-oracle.mjs
      - run: bun run check:generated
      - run: bun run check:boundaries
      - run: bun tooling/check-cli-notices.ts
      - run: bun x --no-install prettier --check .
      - run: cargo fmt --manifest-path native/receiver/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path native/receiver/Cargo.toml --all-targets -- -D warnings
      - name: Compile read-only macOS signed-claim doctor
        if: runner.os == 'macOS'
        run: cargo clippy --locked --manifest-path native/receiver/Cargo.toml --all-targets --features output-doctor-macos -- -D warnings
      - name: Verify inspection-only macOS doctor
        if: runner.os == 'macOS'
        run: cargo test --locked --manifest-path native/receiver/Cargo.toml --features output-doctor-macos --lib output_doctor

      - name: Isolate Windows malformed catalog-child response
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          THUMBLE_REWRITE_PIPE_PROBE: "1"
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          foreach ($attempt in 1..8) {
            "catalog-child iteration=$attempt" | Tee-Object -FilePath reports/private-pipe-probe.log -Append
            bun test tests/phone-catalog.test.ts -t "malformed phone catalog child result terminates its poisoned owner" 2>&1 | Tee-Object -FilePath reports/private-pipe-probe.log -Append
            $testExit = $LASTEXITCODE
            if ($testExit -ne 0) { exit $testExit }
          }
      - name: Isolate Windows stale-grant regression with phase diagnostics
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          RUST_BACKTRACE: "1"
          THUMBLE_REWRITE_INPUT_IO_PROBE: "1"
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          cargo test --locked --manifest-path native/receiver/Cargo.toml --lib phone_trust::tests::durable_authorization_observations_remain_monotonic_across_journal_recovery -- --exact --nocapture 2>&1 | Tee-Object -FilePath reports/native-stale-grant.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          foreach ($attempt in 1..8) {
            "native-stale-grant iteration=$attempt" | Tee-Object -FilePath reports/native-stale-grant.log -Append
            cargo test --locked --manifest-path native/receiver/Cargo.toml --test native_ingress_process stale_grant_receipts_and_old_generation_packets_cannot_replace_or_release_new_configuration -- --exact --nocapture 2>&1 | Tee-Object -FilePath reports/native-stale-grant.log -Append
            $testExit = $LASTEXITCODE
            if ($testExit -ne 0) { exit $testExit }
          }
      # Bound concurrent fixture processes on hosted runners. Concurrency within
      # each native scenario and all safety deadlines remain unchanged.
      - run: bun run native:test
        env:
          RUST_TEST_THREADS: "2"
          THUMBLE_REWRITE_INPUT_IO_PROBE: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: bun run native:build
      - name: Verify native TLS with independent Node/OpenSSL client
        run: |
          cargo build --locked --manifest-path native/receiver/Cargo.toml --example control_tls_probe
          node tooling/test-control-tls.mjs
      - run: bun run typecheck
      - run: bun run test:ci
        timeout-minutes: 2
      - run: bun run build
      - run: bun run test:package:ci
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: rewrite-m2-recording-${{ matrix.os }}
          path: Rewrite/dist/
          if-no-files-found: error
      - name: Typecheck generated Swift DTOs
        if: runner.os == 'macOS'
        run: swiftc -typecheck packages/contracts/generated/swift/GamepadStateV1.swift
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && hashFiles('Rewrite/reports/private-pipe-probe.log') != ''
        with:
          name: rewrite-private-pipe-${{ matrix.os }}
          path: Rewrite/reports/private-pipe-probe.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && hashFiles('Rewrite/reports/native-stale-grant.log') != ''
        with:
          name: rewrite-native-stale-grant-${{ matrix.os }}
          path: Rewrite/reports/native-stale-grant.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('Rewrite/reports/*junit.xml') != ''
        with:
          name: rewrite-portable-tests-${{ matrix.os }}
          path: Rewrite/reports/*junit.xml
          if-no-files-found: error
