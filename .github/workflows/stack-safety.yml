name: Stack Safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stack-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Constrained stack and frame budgets
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show arm64 toolchain
        run: |
          test "$(uname -m)" = arm64
          uname -m
          xcodebuild -version
          swift --version

      - name: Verify stack safety
        env:
          STACK_SAFETY_DERIVED_DATA_PATH: ${{ runner.temp }}/ThumbleStackSafety
        run: ./scripts/verify-stack-safety.sh
