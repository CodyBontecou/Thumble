name: TypeScript rewrite native mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Rewrite/native/**"
      - "Rewrite/apps/mobile/**"
      - "Rewrite/apps/cli/**"
      - "Rewrite/apps/service/**"
      - "Rewrite/packages/**"
      - "Rewrite/packages/*/package.json"
      - "Rewrite/packages/client/src/mobile-input.ts"
      - "Rewrite/packages/contracts/src/mobile-input.ts"
      - "Rewrite/packages/contracts/generated/**"
      - "Rewrite/packages/contracts/schema/**"
      - "Rewrite/packages/fixtures/**"
      - "Rewrite/tooling/**"
      - "Rewrite/package.json"
      - "Rewrite/bun.lock"
      - "Rewrite/bunfig.toml"
      - "Rewrite/tsconfig*.json"
      - "Host/fixtures/gamepad/v2.json"
      - ".github/actions/**"
      - ".github/workflows/typescript-rewrite-mobile.yml"
  pull_request:
    paths:
      - "Rewrite/native/**"
      - "Rewrite/apps/mobile/**"
      - "Rewrite/apps/cli/**"
      - "Rewrite/apps/service/**"
      - "Rewrite/packages/**"
      - "Rewrite/packages/*/package.json"
      - "Rewrite/packages/client/src/mobile-input.ts"
      - "Rewrite/packages/contracts/src/mobile-input.ts"
      - "Rewrite/packages/contracts/generated/**"
      - "Rewrite/packages/contracts/schema/**"
      - "Rewrite/packages/fixtures/**"
      - "Rewrite/tooling/**"
      - "Rewrite/package.json"
      - "Rewrite/bun.lock"
      - "Rewrite/bunfig.toml"
      - "Rewrite/tsconfig*.json"
      - "Host/fixtures/gamepad/v2.json"
      - ".github/actions/**"
      - ".github/workflows/typescript-rewrite-mobile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  ios-native:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      THUMBLE_REWRITE_CONTROL_TERMINAL_PROBE: "1"
    defaults:
      run:
        working-directory: Rewrite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check:generated
      - run: bun run mobile:prepare
      - name: Record native toolchain
        run: |
          mkdir -p reports
          xcodebuild -version | tee reports/mobile-ios-toolchain.txt
          swift --version | tee -a reports/mobile-ios-toolchain.txt
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build synthetic native TLS witness
        id: native-probes
        run: cargo build --locked --manifest-path native/receiver/Cargo.toml --bins --examples
      - name: Swift native contract and lifecycle tests
        run: |
          set -o pipefail
          THUMBLE_NATIVE_INPUT_PROBE="$PWD/native/receiver/target/debug/examples/phone_input_probe" THUMBLE_NATIVE_AUTH_PROBE="$PWD/native/receiver/target/debug/examples/phone_control_probe" THUMBLE_NATIVE_ENROLLMENT_PROBE="$PWD/native/receiver/target/debug/examples/enrollment_probe" THUMBLE_NATIVE_TLS_PROBE="$PWD/native/receiver/target/debug/examples/control_tls_probe" swift test --package-path native/mobile-input/ios 2>&1 | tee reports/mobile-swift.txt
      - name: Require actual phone editor service and Swift SDK witness
        env:
          THUMBLE_REWRITE_EDITOR_CROSS_LAYER: "1"
          THUMBLE_EDITOR_EVIDENCE: reports/mobile-editor-cross-layer.json
          THUMBLE_EDITOR_SWIFT_COMMAND: '["swift","test","--package-path","native/mobile-input/ios","--filter","realServiceEditorUsesPinnedTLSAndExactReceipt"]'
        run: |
          set -euo pipefail
          export THUMBLE_EDITOR_PYTHON="$(command -v python3)"
          "$THUMBLE_EDITOR_PYTHON" -c 'import ssl; assert ssl.HAS_TLSv1_3'
          bun test tests/editor-cross-layer.test.ts 2>&1 | tee reports/mobile-editor-cross-layer.txt
      - name: Require real-service Swift catalog and five-mode input witnesses
        run: |
          set -euo pipefail
          export THUMBLE_REWRITE_PROBE_STAGE_DIAGNOSTICS=1
          export THUMBLE_REAL_SERVICE_PHONE_PROBE="$PWD/tooling/real-service-phone-probe.ts"
          export THUMBLE_NATIVE_INPUT_PROBE="$THUMBLE_REAL_SERVICE_PHONE_PROBE"
          for witness in catalog input saved-map analog; do
            if [[ "$witness" == catalog ]]; then
              test_filter=actualRealServiceCatalogReadPreservesNativePhoneHeldInput
              expected_cases=2
            elif [[ "$witness" == input ]]; then
              test_filter=actualPhoneTouchCrossesTlsAndNativeIpcThenRetiresAndReconnectsNeutral
              expected_cases=5
            elif [[ "$witness" == saved-map ]]; then
              test_filter=actualSavedControllerServiceMapDeliversNativeInputAndRejectsUnsupportedProfile
              expected_cases=3
            else
              test_filter=actualSavedAnalogServiceMapDeliversCombinedNativeInputAndRejectsUnsupportedProfile
              expected_cases=3
            fi
            events="$RUNNER_TEMP/real-service-swift-$witness.jsonl"
            status=0
            swift test --package-path native/mobile-input/ios --filter "$test_filter" --event-stream-output-path "$events" --event-stream-version 0 > "$RUNNER_TEMP/real-service-swift-$witness.log" 2>&1 || status=$?
            python3 tooling/check_real_service_swift_witness.py "$events" "$test_filter" "$expected_cases" "$status" "reports/mobile-real-service-swift-$witness.json" "$RUNNER_TEMP/real-service-swift-$witness.log" "reports/mobile-real-service-swift-$witness-diagnostics.json"
          done
      - name: Compile native modules directly against both iOS SDKs
        id: ios-sdk-build
        if: always() && steps.native-probes.outcome == 'success'
        run: |
          bun run mobile:ios:sdk --sdk iphonesimulator
          bun run mobile:ios:sdk --sdk iphoneos
      - name: Exercise production iOS TLS runtime without the React build
        if: always() && steps.ios-sdk-build.outcome == 'success'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tooling -p test_ios_tls_runtime.py -v
          python3 -m unittest discover -s tooling -p test_ios_runtime_stages.py -v
          python3 -m unittest discover -s tooling -p test_ios_runtime_orchestration.py -v
          python3 -m unittest discover -s tooling -p test_real_service_swift_witness.py -v
          python3 -m unittest discover -s tooling -p test_bank_presentation_ios_probe.py -v
          python3 -m unittest discover -s tooling -p test_native_control_terminal.py -v
          python3 -m unittest discover -s tooling -p test_native_input_error.py -v
          python3 tooling/run_mobile_app_probe.py --platform ios --terminal-report reports/mobile-ios-control-terminal-outcomes.json --input-error-report reports/mobile-ios-input-error-events.json -- python3 tooling/check_ios_tls_runtime.py --report reports/mobile-ios-tls-runtime.json > "$RUNNER_TEMP/ios-tls-runtime-private.txt" 2>&1
      - name: Build native iOS Simulator module
        working-directory: Rewrite/native/mobile-input/ios
        run: xcodebuild -scheme ThumbleMobileInput -destination 'generic/platform=iOS Simulator' -derivedDataPath '${{ runner.temp }}/rewrite-ios-simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Execute synthetic Keychain provider test headlessly
        run: |
          set -o pipefail
          python3 tooling/test_native_vault_results.py
          xcrun simctl list devices available -j > reports/mobile-ios-devices.json
          device_id="$(python3 -c 'import json; d=json.load(open("reports/mobile-ios-devices.json")); print(next(x["udid"] for runtime,devices in d["devices"].items() if ".iOS-" in runtime for x in devices if x["name"].startswith("iPhone")))')"
          library_status=0
          (cd native/mobile-input/ios && xcodebuild -scheme ThumbleMobileInput -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath "$RUNNER_TEMP/rewrite-ios-simulator" -resultBundlePath "$RUNNER_TEMP/rewrite-ios-library-tests.xcresult" -parallel-testing-enabled NO test) 2>&1 | tee reports/mobile-ios-library-tests.txt || library_status=$?
          xcrun xcresulttool get test-results summary --schema-version 0.1.0 --path "$RUNNER_TEMP/rewrite-ios-library-tests.xcresult" > reports/mobile-ios-library-summary.json
          provider_status=0
          xcodebuild -project native/mobile-input/ios/ProviderTests/KeychainProvider.xcodeproj -scheme KeychainProvider -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath "$RUNNER_TEMP/rewrite-keychain-tests" -resultBundlePath "$RUNNER_TEMP/rewrite-keychain-tests.xcresult" -parallel-testing-enabled NO test 2>&1 | tee reports/mobile-ios-keychain.txt || provider_status=$?
          xcrun xcresulttool get test-results tests --schema-version 0.1.0 --path "$RUNNER_TEMP/rewrite-keychain-tests.xcresult" > reports/mobile-ios-keychain-tests.json
          xcrun xcresulttool get test-results summary --schema-version 0.1.0 --path "$RUNNER_TEMP/rewrite-keychain-tests.xcresult" > reports/mobile-ios-keychain-summary.json
          python3 tooling/check_native_vault_results.py ios reports/mobile-ios-keychain-tests.json reports/mobile-ios-keychain-summary.json | tee reports/mobile-ios-keychain-verification.txt
          if [[ "$library_status" != 0 ]]; then exit "$library_status"; fi
          exit "$provider_status"
      - name: Build native iPhone module
        working-directory: Rewrite/native/mobile-input/ios
        run: xcodebuild -scheme ThumbleMobileInput -destination 'generic/platform=iOS' -derivedDataPath '${{ runner.temp }}/rewrite-ios-device' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewrite-mobile-ios-native
          path: |
            Rewrite/reports/mobile-*.txt
            Rewrite/reports/mobile-*.json
            Rewrite/reports/mobile-ios-*/build.json
          if-no-files-found: error

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Rewrite/native/mobile-input/android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install real-service dependencies
        working-directory: Rewrite
        run: bun install --frozen-lockfile
      - name: Prepare shared native SDK fixtures
        working-directory: Rewrite
        run: bun run mobile:prepare
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build synthetic native TLS witness
        working-directory: Rewrite
        run: cargo build --locked --manifest-path native/receiver/Cargo.toml --bins --examples
      - name: Build and test native Android module
        run: THUMBLE_NATIVE_INPUT_PROBE="$GITHUB_WORKSPACE/Rewrite/native/receiver/target/debug/examples/phone_input_probe" THUMBLE_NATIVE_AUTH_PROBE="$GITHUB_WORKSPACE/Rewrite/native/receiver/target/debug/examples/phone_control_probe" THUMBLE_NATIVE_ENROLLMENT_PROBE="$GITHUB_WORKSPACE/Rewrite/native/receiver/target/debug/examples/enrollment_probe" THUMBLE_NATIVE_TLS_PROBE="$GITHUB_WORKSPACE/Rewrite/native/receiver/target/debug/examples/control_tls_probe" bash ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug lintDebug
      - name: Preserve ordinary native suite reports
        if: always()
        run: |
          mkdir -p build/synthetic-native-results build/synthetic-native-reports
          if [[ -d build/test-results ]]; then cp -R build/test-results/. build/synthetic-native-results/; fi
          if [[ -d build/reports ]]; then cp -R build/reports/. build/synthetic-native-reports/; fi
      - name: Require actual phone editor service and Kotlin SDK witness
        working-directory: Rewrite
        env:
          THUMBLE_REWRITE_EDITOR_CROSS_LAYER: "1"
          THUMBLE_EDITOR_EVIDENCE: reports/mobile-real-service-kotlin-editor.json
          THUMBLE_EDITOR_ANDROID_COMMAND: '["./native/mobile-input/android/gradlew","-p","native/mobile-input/android","--no-daemon","--rerun-tasks","testDebugUnitTest","--tests","com.thumble.rewrite.input.PhoneEditorRealServiceTest"]'
        run: |
          set -euo pipefail
          mkdir -p reports
          export THUMBLE_EDITOR_PYTHON="$(command -v python3)"
          "$THUMBLE_EDITOR_PYTHON" -c 'import ssl; assert ssl.HAS_TLSv1_3'
          bun test tests/editor-cross-layer.test.ts 2>&1 | tee reports/mobile-real-service-kotlin-editor.txt
          mkdir -p native/mobile-input/android/build/synthetic-native-results/editor-service
          cp native/mobile-input/android/build/test-results/testDebugUnitTest/TEST-com.thumble.rewrite.input.PhoneEditorRealServiceTest.xml native/mobile-input/android/build/synthetic-native-results/editor-service/
      - name: Require real-service Kotlin catalog and five-mode input witnesses
        run: |
          set -euo pipefail
          export THUMBLE_REAL_SERVICE_PHONE_PROBE="$GITHUB_WORKSPACE/Rewrite/tooling/real-service-phone-probe.ts"
          export THUMBLE_NATIVE_INPUT_PROBE="$THUMBLE_REAL_SERVICE_PHONE_PROBE"
          mkdir -p "$GITHUB_WORKSPACE/Rewrite/reports"
          for witness in catalog input saved-map analog; do
            if [[ "$witness" == catalog ]]; then
              filters=(--tests 'com.thumble.rewrite.input.RealServicePhoneTest.actualRealServiceCatalogReadPreservesNativePhoneHeldInput')
              result_file=TEST-com.thumble.rewrite.input.RealServicePhoneTest.xml
            elif [[ "$witness" == input ]]; then
              filters=(--tests 'com.thumble.rewrite.input.PhoneInputTest.actualNativeTouchCrossesTlsAndIpcWithFreshNeutralReconnect' --tests 'com.thumble.rewrite.input.PhoneInputTest.actualAutomaticRenewalHoldsBeyondInitialExpiryAcrossUdpAndTlsFallback')
              result_file=TEST-com.thumble.rewrite.input.PhoneInputTest.xml
            elif [[ "$witness" == saved-map ]]; then
              filters=(--tests 'com.thumble.rewrite.input.SavedControllerServiceTest.actualSavedControllerServiceMapDeliversNativeInputAndRejectsUnsupportedProfile')
              result_file=TEST-com.thumble.rewrite.input.SavedControllerServiceTest.xml
            else
              filters=(--tests 'com.thumble.rewrite.input.SavedAnalogServiceTest.actualSavedAnalogMapDrivesBothSticksAndTriggersOverUdpAndFallback')
              result_file=TEST-com.thumble.rewrite.input.SavedAnalogServiceTest.xml
            fi
            status=0
            bash ./gradlew --no-daemon testDebugUnitTest "${filters[@]}" --rerun > "$RUNNER_TEMP/real-service-kotlin-$witness.log" 2>&1 || status=$?
            python3 - "build/test-results/testDebugUnitTest/$result_file" "$witness" "$status" "$GITHUB_WORKSPACE/Rewrite/reports/mobile-real-service-kotlin-$witness.json" <<'PYCODE'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          source, witness, status, destination = sys.argv[1:]
          expected = {
              "catalog": {"actualRealServiceCatalogReadPreservesNativePhoneHeldInput"},
              "input": {"actualNativeTouchCrossesTlsAndIpcWithFreshNeutralReconnect", "actualAutomaticRenewalHoldsBeyondInitialExpiryAcrossUdpAndTlsFallback"},
              "saved-map": {"actualSavedControllerServiceMapDeliversNativeInputAndRejectsUnsupportedProfile"},
              "analog": {"actualSavedAnalogMapDrivesBothSticksAndTriggersOverUdpAndFallback"},
          }[witness]
          result = {"platform": "kotlin", "witness": witness, "status": "failed"}
          try:
              path = pathlib.Path(source)
              assert int(status) == 0 and path.stat().st_size <= 2_097_152
              suite = ET.fromstring(path.read_bytes())
              cases = suite.findall("testcase")
              assert suite.tag == "testsuite" and len(cases) == len(expected)
              assert {c.attrib["name"] for c in cases} == expected
              assert int(suite.attrib["tests"]) == len(expected)
              assert all(int(suite.attrib[k]) == 0 for k in ("skipped", "failures", "errors"))
              assert all(len(c) == 0 for c in cases)
              result.update(status="passed", cases=len(cases), modes={"catalog": 2, "input": 5, "saved-map": 3, "analog": 3}[witness], skipped=0, failures=0)
          except (AssertionError, OSError, ValueError, KeyError, TypeError, ET.ParseError):
              pass
          pathlib.Path(destination).write_text(json.dumps(result, sort_keys=True) + "\n")
          if result["status"] != "passed":
              raise SystemExit("real_service_kotlin_witness_failed")
          PYCODE
          done
      - name: Require actual Kotlin presentation-service witness
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bun_bin="$(command -v bun)"
          [[ "$("$bun_bin" --version)" == 1.4.3 ]]
          bun_dir="$(dirname "$bun_bin")"
          export PATH="$bun_dir:$PATH"
          export THUMBLE_PRESENTATION_SERVICE_PROBE="$GITHUB_WORKSPACE/Rewrite/tooling/presentation-service-probe.ts"
          test -x "$THUMBLE_PRESENTATION_SERVICE_PROBE"
          test -x "$GITHUB_WORKSPACE/Rewrite/native/receiver/target/debug/thumble-rewrite-receiver"
          result_file=build/test-results/testDebugUnitTest/TEST-com.thumble.rewrite.input.PhonePresentationServiceTest.xml
          rm -f "$result_file"
          status=0
          bash ./gradlew --no-daemon testDebugUnitTest --tests 'com.thumble.rewrite.input.PhonePresentationServiceTest.actualPresentationRefreshAndStaleCASPreserveHeldInputThenRevokePreventsMetadata' --rerun-tasks > "$RUNNER_TEMP/real-service-kotlin-presentation.log" 2>&1 || status=$?
          mkdir -p build/synthetic-native-results/presentation-service "$GITHUB_WORKSPACE/Rewrite/reports"
          if [[ -f "$result_file" ]]; then cp "$result_file" build/synthetic-native-results/presentation-service/; fi
          python3 - "$result_file" "$status" "$GITHUB_WORKSPACE/Rewrite/reports/mobile-real-service-kotlin-presentation.json" <<'PYCODE'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          source, status, destination = sys.argv[1:]
          result = {"platform": "kotlin", "witness": "presentation", "status": "failed"}
          try:
              path = pathlib.Path(source)
              assert int(status) == 0 and path.stat().st_size <= 2_097_152
              suite = ET.fromstring(path.read_bytes())
              cases = suite.findall("testcase")
              assert suite.tag == "testsuite" and len(cases) == 1
              assert cases[0].attrib["classname"] == "com.thumble.rewrite.input.PhonePresentationServiceTest"
              assert cases[0].attrib["name"] == "actualPresentationRefreshAndStaleCASPreserveHeldInputThenRevokePreventsMetadata"
              assert int(suite.attrib["tests"]) == 1
              assert all(int(suite.attrib[k]) == 0 for k in ("skipped", "failures", "errors"))
              assert len(cases[0]) == 0
              result.update(status="passed", cases=1, modes=2, skipped=0, failures=0)
          except (AssertionError, OSError, ValueError, KeyError, TypeError, ET.ParseError):
              pass
          pathlib.Path(destination).write_text(json.dumps(result, sort_keys=True) + "\n")
          if result["status"] != "passed":
              raise SystemExit("real_service_kotlin_presentation_witness_failed")
          PYCODE
      - name: Require actual Kotlin bank presentation-service witness
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bun_bin="$(command -v bun)"
          [[ "$("$bun_bin" --version)" == 1.4.3 ]]
          bun_dir="$(dirname "$bun_bin")"
          export PATH="$bun_dir:$PATH"
          export THUMBLE_BANK_PRESENTATION_SERVICE_PROBE="$GITHUB_WORKSPACE/Rewrite/tooling/presentation-service-probe.ts"
          test -x "$THUMBLE_BANK_PRESENTATION_SERVICE_PROBE"
          test -x "$GITHUB_WORKSPACE/Rewrite/native/receiver/target/debug/thumble-rewrite-receiver"
          result_file=build/test-results/testDebugUnitTest/TEST-com.thumble.rewrite.input.PhoneBankPresentationServiceTest.xml
          rm -f "$result_file"
          status=0
          bash ./gradlew --no-daemon testDebugUnitTest --tests 'com.thumble.rewrite.input.PhoneBankPresentationServiceTest.actualAllBanksAndThemesRefreshWhileTriggersAndSouthStayHeldThenRevocationFencesReads' --rerun-tasks > "$RUNNER_TEMP/real-service-kotlin-bank-presentation.log" 2>&1 || status=$?
          mkdir -p build/synthetic-native-results/bank-presentation-service "$GITHUB_WORKSPACE/Rewrite/reports"
          if [[ -f "$result_file" ]]; then cp "$result_file" build/synthetic-native-results/bank-presentation-service/; fi
          python3 - "$result_file" "$status" "$GITHUB_WORKSPACE/Rewrite/reports/mobile-real-service-kotlin-bank-presentation.json" <<'PYCODE'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          source, status, destination = sys.argv[1:]
          result = {"platform": "kotlin", "witness": "bank-presentation", "status": "failed"}
          try:
              path = pathlib.Path(source)
              assert int(status) == 0 and path.stat().st_size <= 2_097_152
              suite = ET.fromstring(path.read_bytes())
              cases = suite.findall("testcase")
              assert suite.tag == "testsuite" and len(cases) == 1
              assert cases[0].attrib["classname"] == "com.thumble.rewrite.input.PhoneBankPresentationServiceTest"
              assert cases[0].attrib["name"] == "actualAllBanksAndThemesRefreshWhileTriggersAndSouthStayHeldThenRevocationFencesReads"
              assert int(suite.attrib["tests"]) == 1
              assert all(int(suite.attrib[k]) == 0 for k in ("skipped", "failures", "errors"))
              assert len(cases[0]) == 0
              result.update(status="passed", cases=1, modes=2, skipped=0, failures=0)
          except (AssertionError, OSError, ValueError, KeyError, TypeError, ET.ParseError):
              pass
          pathlib.Path(destination).write_text(json.dumps(result, sort_keys=True) + "\n")
          if result["status"] != "passed":
              raise SystemExit("real_service_kotlin_bank_presentation_witness_failed")
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewrite-mobile-android-native
          path: |
            Rewrite/native/mobile-input/android/build/synthetic-native-results/
            Rewrite/native/mobile-input/android/build/synthetic-native-reports/
            Rewrite/reports/mobile-real-service-kotlin-*.json
            Rewrite/native/mobile-input/android/build/outputs/aar/
          if-no-files-found: error

  android-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM on the ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute synthetic Keystore provider test headlessly
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/Rewrite/native/mobile-input/android/gradlew" -p "$GITHUB_WORKSPACE/Rewrite/native/mobile-input/android" --no-daemon connectedDebugAndroidTest
      - name: Require actual Keystore case execution
        run: |
          python3 Rewrite/tooling/test_native_vault_results.py
          python3 Rewrite/tooling/check_native_vault_results.py android Rewrite/native/mobile-input/android/build/outputs/androidTest-results/connected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewrite-android-keystore-provider
          path: |
            Rewrite/native/mobile-input/android/build/outputs/androidTest-results/
            Rewrite/native/mobile-input/android/build/reports/androidTests/
          if-no-files-found: error

  android-editor-journal-api26:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM on the ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute actual private journal provider on API 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '26'
            bash "$GITHUB_WORKSPACE/Rewrite/native/mobile-input/android/gradlew" -p "$GITHUB_WORKSPACE/Rewrite/native/mobile-input/android" --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.thumble.rewrite.input.EditorJournalDeviceTest
      - name: Require exact provider execution and sanitized evidence
        if: always()
        run: |
          python3 Rewrite/tooling/test_editor_journal_device.py
          mkdir -p Rewrite/reports
          python3 Rewrite/tooling/check_editor_journal_device.py Rewrite/native/mobile-input/android/build/outputs/androidTest-results/connected > Rewrite/reports/mobile-editor-journal-api26.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewrite-android-editor-journal-api26
          path: Rewrite/reports/mobile-editor-journal-api26.json
          if-no-files-found: error
